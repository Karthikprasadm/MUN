<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Connected | MUNSoc RNSIT</title>
  <meta name="description" content="A canvas-based interactive simulation of walking crowds to stay connected with MUNSoc RNSIT.">
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Specific styles for the Stay Connected page matching skiper39 exactly */
    .connected-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff; /* White background */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .connected-header {
      position: absolute;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      font-family: 'Outfit', sans-serif;
    }
    
    .connected-title {
      font-size: 3rem;
      font-weight: 800;
      color: #000000; /* Black text */
      margin-bottom: 8px;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    
    /* Pill-shaped Subscription Form */
    /* Minimalist Single-Line Subscription Form matching skiper56 */
    .subscribe-form {
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      width: 440px;
      max-width: 90%;
      margin: 30px auto 0 auto;
      border-bottom: 2px solid rgba(0, 0, 0, 0.1);
      transition: border-color 0.3s ease;
      pointer-events: auto; /* Enable input interactions */
    }

    .subscribe-form:focus-within {
      border-color: #000000;
    }

    .subscribe-input {
      width: 0;
      flex-grow: 1;
      min-width: 0;
      border: none;
      background: transparent;
      padding: 12px 16px 12px 0;
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem; /* Large minimalist typography */
      font-weight: 400;
      color: #000000;
      outline: none;
      letter-spacing: -0.02em;
    }

    .subscribe-input::placeholder {
      color: rgba(0, 0, 0, 0.2); /* Very subtle light placeholder */
    }

    .subscribe-btn {
      border: none;
      background: transparent;
      color: #000000;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem; /* Large arrow matching input scale */
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .subscribe-btn:hover {
      transform: translateX(6px);
      opacity: 0.7;
    }

    .subscribe-btn:active {
      transform: translateX(3px);
    }
    
    /* Clean canvas walking area at bottom of viewport */
    #crowd-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%; /* Full screen height to keep peeps at the bottom edge */
      z-index: 5;
      pointer-events: none;
      filter: none; /* Original vector black outline + white fill style */
    }

    /* Mobile Responsive Optimizations (< 768px) */
    @media (max-width: 768px) {
      .connected-header {
        top: 38%; /* Centered vertically in the mobile negative space */
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .connected-title {
        font-size: 2.2rem; /* Scaled down to prevent text clipping */
        letter-spacing: -0.02em;
      }
      .subscribe-form {
        width: 290px; /* Compact width fitting mobile margins */
        margin-top: 20px;
        background: rgba(255, 255, 255, 0.96); /* Solid white mask to cover underlying black figures */
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 9999px;
        padding: 4px 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      .subscribe-input {
        font-size: 1.15rem; /* Proportionate input text size */
        padding: 8px 0;
      }
      .subscribe-btn {
        font-size: 1.4rem; /* Clean scaled arrow symbol */
      }
    }

  </style>
</head>
<body>
  <!-- Navigation Pill -->
  <nav class="nav-pill">
    <a href="./index.html" class="nav-item" id="nav-gallery">Gallery</a>
    <a href="./stay-connected.html" class="nav-item active" id="nav-connected">Stay Connected</a>
    <a href="./team.html" class="nav-item" id="nav-team">Team</a>
  </nav>

  <!-- Top Left Logo -->
  <div class="top-left-logo-container">
    <img src="./assets/Logos/25_logo.png" alt="25 Logo" class="top-left-logo">
  </div>

  <!-- Top Right Logo -->
  <div class="top-right-logo-container">
    <img src="./assets/Logos/MUN_logo.png" alt="MUN Logo" class="top-right-logo">
  </div>

  <!-- Main Viewport -->
  <main class="connected-viewport">
    <div class="connected-header">
      <h1 class="connected-title">Stay Connected</h1>
      
      <!-- Subscription Form -->
      <form class="subscribe-form" id="subscribe-form">
        <input type="email" class="subscribe-input" placeholder="sup@gmail.com" required />
        <button type="submit" class="subscribe-btn">→</button>
      </form>
    </div>
    
    <canvas id="crowd-canvas"></canvas>
  </main>

  <!-- Crowd Logic Script -->
  <script type="module" src="./stay-connected.js"></script>
  <script type="module" src="./nav-sliding.js"></script>
</body>
</html>
